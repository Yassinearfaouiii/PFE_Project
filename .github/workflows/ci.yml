name: ATS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate ATS
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Vérifier la syntaxe Python
      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile config.py
          python -m py_compile db.py
          python -m py_compile llm_service.py
          python -m py_compile pages/admin_ats_page.py
          python -m py_compile pages/admin_dashboard_page.py
          python -m py_compile pages/student_form_page.py
          python -m py_compile ui/styles.py
          python -m py_compile ui/theme.py

      # 5. Vérifier les imports principaux
      - name: Check Python imports
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: pfe_platform
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          python -c "import streamlit"
          python -c "import psycopg2"
          python -c "import pdfplumber"
          python -c "import docx"
          python -c "import sklearn"
          python -c "import torch"
          python -c "import sentence_transformers"
          python -c "import llama_cpp"
          python -c "import plotly"

      # 6. Vérifier que Docker peut construire l'application
      - name: Build Docker image
        run: |
          docker build -t ats-app:ci .

      # 7. Vérifier que l'image Docker existe
      - name: Verify Docker image
        run: |
          docker image inspect ats-app:ci